spring:
  application:
    name: ledger
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}
    hikari:
      # The application runs as ledger_app, which can only INSERT and SELECT Entries and
      # Transactions (V3__ledger_app_role.sql).
      connection-init-sql: set role ledger_app
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # The idempotent producer with acks=all (ADR 0005). The timeouts make a send to a broker
      # that is down fail within seconds, so the publisher retries the batch on a later poll.
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    admin:
      # The ledger creates its topics with their partitions and retention at startup. If Kafka
      # can't be reached it stops instead of starting without them.
      fail-fast: true
  flyway:
    # Setting a user gives Flyway its own connection, so migrations run as the schema owner
    # and not as ledger_app.
    user: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}
  task:
    scheduling:
      pool:
        # The outbox publisher polls every 200 ms; the balanced check, its nightly sweep and
        # partition maintenance get threads of their own so a long run never holds up publishing.
        size: 4
  mvc:
    apiversion:
      use:
        path-segment: 0
      supported: "1"
    problemdetails:
      enabled: true
springdoc:
  # Swagger UI is public at /docs (spec §7); the OpenAPI document stays at /v3/api-docs.
  swagger-ui:
    path: /docs
management:
  endpoints:
    web:
      exposure:
        # Operators read the outbox lag and other gauges at /actuator/metrics; Grafana Alloy scrapes
        # /actuator/prometheus from inside the box (WebSecurity).
        include: health, metrics, prometheus
  metrics:
    distribution:
      # Histograms get these buckets only, to stay under Grafana Cloud's 10k series (spec §13).
      slo:
        "[http.server.requests]": 10ms, 25ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s
        "[ledger.balance.lock.wait]": 1ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 1s
  otlp:
    metrics:
      export:
        # Metrics are scraped, not pushed.
        enabled: false
  observations:
    enable:
      # A trace per poll of every scheduled job, and a span per security filter of every request,
      # would bury the Payment traces.
      "[tasks.scheduled]": false
      "[spring.security]": false
  tracing:
    sampling:
      # Every Payment gets its trace. Compose sets the OTLP endpoint traces are exported to.
      probability: 1.0
ledger:
  demo:
    # How many Demo Sandboxes the public demo creates a day across every visitor (spec §8).
    sandboxes-per-day: 500
  balanced-check:
    # How often the balanced check proves the ledger balanced (spec §13).
    interval: PT60S
    # The full sweep, which checks every Account however long since anything touched it.
    full-sweep-cron: "0 0 2 * * *"
    # How long the Read Model may leave an Account's Entry unapplied, from its Booking Time, before
    # the check counts the Account as drift. Per Account, unlike the Projection Freshness gauge.
    read-model-grace: PT60S
  partition-maintenance:
    # When the job creates Entry partitions three months ahead (ADR 0010): daily, in UTC. It also
    # runs when the ledger starts.
    cron: "0 0 3 * * *"
  read-model:
    # The views module's read-only connection to the readmodel database, which the projector writes.
    datasource:
      url: ${READMODEL_DB_URL:jdbc:postgresql://localhost:5432/readmodel}
      username: ${LEDGER_DB_USER:ledger}
      password: ${LEDGER_DB_PASSWORD:ledger}
  scheme:
    # The Faster Payments Scheme simulator (ADR 0008).
    base-url: ${SCHEME_BASE_URL:http://localhost:8081}
    # A Scheme Submission with no Scheme Outcome after this long is sent again (ADR 0008).
    resend-after: PT15S
    # A Faster Payment with no Scheme Outcome after this long is flagged as a Stuck Payment.
    stuck-after: PT5M
    # A Stuck Payment is still sent with the same End-to-End Id, this often, until the scheme
    # answers. It stays flagged for an Operator and is never reversed automatically.
    stuck-resend-after: PT1M
    # Signs every Scheme Outcome callback with HMAC-SHA256. Read from SSM in production (spec §10).
    callback-hmac-key: ${SCHEME_CALLBACK_HMAC_KEY:local-dev-only-scheme-callback-key}
server:
  # The visitor's IP address comes from the X-Forwarded-For header that the proxy in front of the
  # ledger sets; only proxies on internal addresses are trusted to set it (demo limits, spec §8).
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # The SPA and the API are the same site (spec §8).
        same-site: lax
logging:
  level:
    # The Kafka clients log their whole configuration at INFO whenever one starts.
    org.apache.kafka: warn
    # Logs every failed send, so a Kafka outage logs each outbox row of every retried batch; the
    # outbox publisher logs one warning per failed batch instead.
    org.springframework.kafka.support.LoggingProducerListener: off
