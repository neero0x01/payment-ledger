# Local stack: Postgres, Kafka, the ledger, the projector and the bare transfer page.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Creates the readmodel database on first start (an existing postgres-data volume skips it).
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 5s
      retries: 30

  kafka:
    # Single-node KRaft (spec §10). Setting any KAFKA_ variable replaces the image's defaults, so
    # the whole broker and controller configuration is here.
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka-data:/var/lib/kafka/data

  ledger:
    build:
      context: ..
      dockerfile: ledger/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ledger
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      READMODEL_DB_URL: jdbc:postgresql://postgres:5432/readmodel
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Payments never wait for Kafka; the outbox publisher catches up once it is reachable.
      kafka:
        condition: service_started

  projector:
    # Builds the Read Model from Kafka into the readmodel database (ADR 0002). Headless.
    build:
      context: ..
      dockerfile: projector/Dockerfile
    environment:
      PROJECTOR_DB_URL: jdbc:postgresql://postgres:5432/readmodel
      PROJECTOR_DB_USER: ledger
      PROJECTOR_DB_PASSWORD: ledger
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  web:
    build: ../web
    ports:
      - "5173:80"
    depends_on:
      - ledger

volumes:
  postgres-data:
  kafka-data:
