# Local stack: Postgres, the ledger and the bare transfer page.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 5s
      retries: 30

  ledger:
    build:
      context: ..
      dockerfile: ledger/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ledger
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ../web
    ports:
      - "5173:80"
    depends_on:
      - ledger

volumes:
  postgres-data:
