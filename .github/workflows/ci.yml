name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: Build and test (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build, check and test
        run: ./mvnw -B -ntp verify

  web:
    name: Type check, lint and test (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  smoke:
    name: Smoke test (Playwright against Compose)
    runs-on: ubuntu-latest
    env:
      # The Jib images built below; Compose must run these, not pull a published tag.
      IMAGE_TAG: ci
      # The smoke test logs in as local-customer and pays from the local Accounts.
      LEDGER_PROFILES: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the service images with Jib
        # The runner is amd64; the published images are arm64.
        run: >
          ./mvnw -B -ntp -pl ledger,projector,fps-simulator -am package jib:dockerBuild
          -DskipTests -Dspotless.check.skip=true
          -Dimage.tag=${IMAGE_TAG} -Djib.from.platforms=linux/amd64
      - name: Build the page
        run: docker compose --profile web build web
      - name: Start the stack
        run: docker compose --profile web up -d --no-build --wait
      - name: Wait for the ledger behind Caddy
        run: curl -sf --retry 60 --retry-delay 2 --retry-all-errors http://localhost/actuator/health
      - name: Install Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the smoke test
        working-directory: web
        run: npm run smoke
      - name: Show the stack's logs
        if: failure()
        run: docker compose --profile web logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
      - name: Stop the stack
        if: always()
        run: docker compose --profile web down -v

  images:
    name: Publish images to GHCR
    # Only main publishes, and only once the build and the smoke test pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ledger, web, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the arm64 images with Jib
        # Tagged latest and with the commit SHA, so a deploy can pin an exact build.
        run: >
          ./mvnw -B -ntp -pl ledger,projector,fps-simulator -am package jib:build
          -DskipTests -Dspotless.check.skip=true
          -Djib.to.tags=${{ github.sha }}
