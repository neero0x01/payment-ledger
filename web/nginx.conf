# Serves the page and passes /v1 to the ledger, so the browser sees one origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://ledger:8080;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
