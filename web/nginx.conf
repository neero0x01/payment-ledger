# Serves the page and passes the API and its docs to the ledger, so the browser sees one origin.
# The visitor's address goes in X-Forwarded-For: the demo limits count sandboxes per IP address.
server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ ^/(v1/|v3/api-docs|docs|swagger-ui/) {
        proxy_pass http://ledger:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
