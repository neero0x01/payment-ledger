spring:
  application:
    name: projector
  datasource:
    url: ${PROJECTOR_DB_URL:jdbc:postgresql://localhost:5432/readmodel}
    username: ${PROJECTOR_DB_USER:ledger}
    password: ${PROJECTOR_DB_PASSWORD:ledger}
  flyway:
    # Not db/migration, which holds the ledger's migrations when both are on one classpath.
    locations: classpath:db/readmodel
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: projector
      # A new projector reads every event from the start of the topic.
      auto-offset-reset: earliest
      properties:
        # The ledger creates its topics with their partitions and retention; subscribing must never
        # create one with the broker's defaults.
        allow.auto.create.topics: false
logging:
  level:
    # The Kafka clients log their whole configuration at INFO whenever one starts.
    org.apache.kafka: warn
